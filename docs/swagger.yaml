openapi: 3.0.3
info:
  title: ClinicaFácil API
  description: |
    API REST para o sistema de agendamento de consultas médicas ClinicaFácil.

    ## Autenticação
    A maioria dos endpoints requer um token JWT no header:
    ```
    Authorization: Bearer <seu_token>
    ```
    Obtenha o token via `/api/auth/login` ou `/api/auth/registro`.

    ## Perfis de Acesso
    - **paciente** — acessa apenas seus próprios agendamentos
    - **secretario** — acessa todos os agendamentos e o painel admin
    - **admin** — acesso total, incluindo gerenciamento de usuários
  version: 1.0.0
  contact:
    name: Suporte ClinicaFácil

servers:
  - url: http://localhost:3000/api
    description: Desenvolvimento local

tags:
  - name: Autenticação
    description: Registro, login e gerenciamento de perfil
  - name: Agendamentos
    description: Criação e gerenciamento de consultas
  - name: APIs Externas
    description: Integração com ViaCEP e OpenWeatherMap
  - name: Administrativo
    description: Painel admin (secretário/admin apenas)

paths:
  /auth/registro:
    post:
      tags: [Autenticação]
      summary: Registrar novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                  example: João da Silva
                  minLength: 2
                email:
                  type: string
                  format: email
                  example: joao@email.com
                senha:
                  type: string
                  minLength: 6
                  example: minhasenha123
                telefone:
                  type: string
                  example: "(11) 99999-9999"
                cpf:
                  type: string
                  example: "000.000.000-00"
                dataNascimento:
                  type: string
                  format: date
                  example: "1990-05-15"
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email já cadastrado

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Realizar login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@clinica.com
                senha:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas

  /auth/perfil:
    get:
      tags: [Autenticação]
      summary: Obter dados do perfil autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Autenticação]
      summary: Atualizar perfil
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                telefone:
                  type: string
                dataNascimento:
                  type: string
                  format: date
                endereco:
                  $ref: '#/components/schemas/Endereco'
      responses:
        '200':
          description: Perfil atualizado

  /agendamentos:
    get:
      tags: [Agendamentos]
      summary: Listar agendamentos
      description: Pacientes veem apenas seus agendamentos. Admins/secretários veem todos.
      security:
        - bearerAuth: []
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [agendado, confirmado, cancelado, realizado]
        - name: dataInicio
          in: query
          schema:
            type: string
            format: date
        - name: dataFim
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de agendamentos paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  agendamentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agendamento'
                  paginacao:
                    $ref: '#/components/schemas/Paginacao'
    post:
      tags: [Agendamentos]
      summary: Criar novo agendamento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medico, especialidade, data, horario]
              properties:
                medico:
                  type: string
                  example: "Dr. Carlos Mendes"
                especialidade:
                  type: string
                  enum:
                    - Clínico Geral
                    - Cardiologia
                    - Dermatologia
                    - Ginecologia
                    - Ortopedia
                    - Pediatria
                    - Psiquiatria
                    - Neurologia
                    - Oftalmologia
                    - Urologia
                data:
                  type: string
                  format: date
                  example: "2025-12-15"
                horario:
                  type: string
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                  example: "09:00"
                observacoes:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  agendamento:
                    $ref: '#/components/schemas/Agendamento'
                  alertaChuva:
                    type: string
                    nullable: true
                    example: "⚠️ Previsão de chuva para o dia da consulta!"
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Horário indisponível

  /agendamentos/horarios-disponiveis:
    get:
      tags: [Agendamentos]
      summary: Verificar horários disponíveis
      security:
        - bearerAuth: []
      parameters:
        - name: medico
          in: query
          required: true
          schema:
            type: string
          example: "Dr. Carlos Mendes"
        - name: data
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Horários livres e ocupados
          content:
            application/json:
              schema:
                type: object
                properties:
                  horariosDisponiveis:
                    type: array
                    items:
                      type: string
                    example: ["08:00","08:30","10:00"]
                  horariosOcupados:
                    type: array
                    items:
                      type: string
                    example: ["09:00","09:30"]

  /agendamentos/{id}:
    get:
      tags: [Agendamentos]
      summary: Buscar agendamento por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agendamento encontrado
        '404':
          description: Não encontrado
    put:
      tags: [Agendamentos]
      summary: Atualizar agendamento (ou cancelar)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [agendado, confirmado, cancelado, realizado]
                observacoes:
                  type: string
      responses:
        '200':
          description: Atualizado com sucesso
        '403':
          description: Sem permissão

  /external/cep/{cep}:
    get:
      tags: [APIs Externas]
      summary: Buscar endereço por CEP (ViaCEP)
      security:
        - bearerAuth: []
      parameters:
        - name: cep
          in: path
          required: true
          schema:
            type: string
          example: "01310100"
      responses:
        '200':
          description: Endereço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endereco'
        '404':
          description: CEP não encontrado

  /external/clima:
    get:
      tags: [APIs Externas]
      summary: Previsão climática por data (OpenWeatherMap)
      security:
        - bearerAuth: []
      parameters:
        - name: data
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2025-12-15"
      responses:
        '200':
          description: Previsão climática
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponivel:
                    type: boolean
                  temperatura:
                    type: number
                  descricao:
                    type: string
                  temChuva:
                    type: boolean
                  cidade:
                    type: string

  /admin/dashboard:
    get:
      tags: [Administrativo]
      summary: Estatísticas gerais do sistema
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estatísticas e próximas consultas
        '403':
          description: Acesso negado (apenas admin/secretário)

  /admin/usuarios:
    get:
      tags: [Administrativo]
      summary: Listar usuários (apenas admin)
      security:
        - bearerAuth: []
      parameters:
        - name: busca
          in: query
          schema:
            type: string
        - name: perfil
          in: query
          schema:
            type: string
            enum: [paciente, secretario, admin]
      responses:
        '200':
          description: Lista de usuários

  /admin/relatorio:
    get:
      tags: [Administrativo]
      summary: Relatório por especialidade e status
      security:
        - bearerAuth: []
      parameters:
        - name: dataInicio
          in: query
          schema:
            type: string
            format: date
        - name: dataFim
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dados do relatório

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      properties:
        _id:
          type: string
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
          enum: [paciente, secretario, admin]
        telefone:
          type: string
        ativo:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Endereco:
      type: object
      properties:
        cep:
          type: string
        logradouro:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        estado:
          type: string

    Agendamento:
      type: object
      properties:
        _id:
          type: string
        paciente:
          $ref: '#/components/schemas/Usuario'
        medico:
          type: string
        especialidade:
          type: string
        data:
          type: string
          format: date-time
        horario:
          type: string
        status:
          type: string
          enum: [agendado, confirmado, cancelado, realizado]
        observacoes:
          type: string
        previsaoClimatica:
          type: object
          nullable: true
          properties:
            descricao:
              type: string
            temperatura:
              type: number
            temChuva:
              type: boolean

    Paginacao:
      type: object
      properties:
        total:
          type: integer
        pagina:
          type: integer
        limite:
          type: integer
        totalPaginas:
          type: integer

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        usuario:
          $ref: '#/components/schemas/Usuario'

  responses:
    Unauthorized:
      description: Token inválido ou ausente
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Token de autenticação não fornecido.
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    msg:
                      type: string
                    path:
                      type: string
